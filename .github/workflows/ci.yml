name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests with branch coverage
        run: uv run pytest --cov=mcp_crosswalk --cov-branch --cov-report=term-missing --cov-fail-under=85
      - name: Validate crosswalk
        run: uv run mcpxw crosswalk validate
      - name: Dependency audit
        run: uv run pip-audit

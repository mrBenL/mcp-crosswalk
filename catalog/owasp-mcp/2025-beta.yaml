version: "2025-beta"
retrieved: "2026-10-07"
source_url: "https://owasp.org/www-project-mcp-top-10/"
license_note: >-
  Risk IDs and titles are from the OWASP MCP Top 10 (https://owasp.org/www-project-mcp-top-10/),
